
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MyTube{% endblock %}</title>

<style>
    /* =========================
   1. CSS VARIABLES
========================= */
:root {
    --bg-color: #0f0f0f;
    --header-color: #0f0f0f;
    --sidebar-color: #0f0f0f;
    --text-color: #f1f1f1;
    --secondary-text: #aaaaaa;
    --border-color: #303030;
    --hover-color: #272727;
    --button-color: #272727;
    --input-color: #121212;
    --active-color: #3f3f3f;
    --brand-color: #ff0000;
}

/* =========================
   2. RESET AND GLOBAL STYLE
========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
}

/* =========================
   3. HEADER / TOP NAVIGATION
========================= */
.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: var(--header-color);
    color: var(--text-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border-color);
    z-index: 1000;
}

.left-header {
    display: flex;
    align-items: center;
    gap: 22px;
}

.menu {
    font-size: 24px;
    cursor: pointer;
    color: var(--text-color);
}

.logo {
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
    color: var(--text-color);
}

.logo span {
    color: var(--brand-color);
}

/* =========================
   4. SEARCH BAR
========================= */
.search-box {
    display: flex;
    align-items: center;
    width: 45%;
    max-width: 600px;
}

.search-box input {
    width: 100%;
    height: 40px;
    background: var(--input-color);
    color: var(--text-color);
    border: 1px solid #3f3f3f;
    border-radius: 22px 0 0 22px;
    padding: 0 18px;
    font-size: 16px;
    outline: none;
}

.search-box input::placeholder {
    color: var(--secondary-text);
}

.search-box input:focus {
    border-color: #1c62b9;
}

.search-box button {
    height: 40px;
    min-width: 64px;
    border: 1px solid #3f3f3f;
    border-left: none;
    border-radius: 0 22px 22px 0;
    background: var(--button-color);
    color: var(--text-color);
    font-size: 18px;
    cursor: pointer;
}

.search-box button:hover {
    background: var(--active-color);
}

/* =========================
   5. RIGHT HEADER
========================= */
.right-header {
    display: flex;
    align-items: center;
    gap: 20px;
}

.header-icon {
    font-size: 22px;
    cursor: pointer;
    color: var(--text-color);
}

.header-icon:hover {
    opacity: 0.8;
}

.profile {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #065fd4;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* =========================
   6. LEFT SIDEBAR
========================= */
.sidebar {
    position: fixed;
    top: 60px;
    left: 0;
    width: 220px;
    height: calc(100vh - 60px);
    background: var(--sidebar-color);
    color: var(--text-color);
    padding: 12px;
    overflow-y: auto;
    border-right: 1px solid var(--border-color);
}

.sidebar a {
    display: flex;
    align-items: center;
    gap: 24px;
    height: 44px;
    padding: 0 12px;
    margin-bottom: 4px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--text-color);
    font-size: 14px;
    transition: background 0.2s;
}

.sidebar a:hover {
    background: var(--hover-color);
}

.sidebar a.active {
    background: var(--active-color);
    font-weight: bold;
}

.sidebar-icon {
    font-size: 21px;
    width: 24px;
    text-align: center;
}

.sidebar hr {
    border: none;
    border-top: 1px solid var(--border-color);
    margin: 12px 0;
}

.sidebar h4 {
    padding: 10px 12px;
    font-size: 16px;
    color: var(--text-color);
}

/* =========================
   7. MAIN CONTENT
========================= */
.main {
    margin-left: 220px;
    padding-top: 60px;
    min-height: 100vh;
    background: var(--bg-color);
}

/* =========================
   8. CATEGORY FILTERS
========================= */
.categories {
    position: fixed;
    top: 60px;
    left: 220px;
    right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 24px;
    background: var(--bg-color);
    overflow-x: auto;
    white-space: nowrap;
    z-index: 900;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.categories button {
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    background: var(--button-color);
    color: var(--text-color);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}

.categories button.active,
.categories button:hover {
    background: var(--text-color);
    color: var(--bg-color);
}

/* =========================
   9. DYNAMIC DJANGO CONTENT
========================= */
main {
    padding: 24px;
    margin-top: 56px;
    min-height: calc(100vh - 116px);
    background: var(--bg-color);
    color: var(--text-color);
}

/* General content styling */
main h1,
main h2,
main h3,
main h4,
main p,
main label {
    color: var(--text-color);
}

main a {
    color: #3ea6ff;
}

main input,
main textarea,
main select {
    background: var(--input-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
}

main input::placeholder,
main textarea::placeholder {
    color: var(--secondary-text);
}

main button {
    cursor: pointer;
}

/* =========================
   10. RESPONSIVE: TABLETS
========================= */
@media (max-width: 900px) {
    .sidebar {
        width: 76px;
        padding: 12px 4px;
    }

    .sidebar a {
        flex-direction: column;
        justify-content: center;
        gap: 5px;
        height: 68px;
        padding: 4px 0;
        font-size: 10px;
    }

    .sidebar-icon {
        font-size: 22px;
    }

    .sidebar h4,
    .sidebar hr,
    .sidebar .extra {
        display: none;
    }

    .main {
        margin-left: 76px;
    }

    .categories {
        left: 76px;
    }

    .search-box {
        width: 40%;
    }

    .right-header {
        gap: 10px;
    }
}

/* =========================
   11. RESPONSIVE: MOBILE
========================= */
@media (max-width: 600px) {
    .header {
        padding: 0 12px;
        gap: 10px;
    }

    .left-header {
        gap: 10px;
    }

    .logo {
        font-size: 18px;
    }

    .search-box {
        width: auto;
        flex: 1;
    }

    .search-box input {
        min-width: 0;
        padding: 0 10px;
        font-size: 14px;
    }

    .search-box button {
        min-width: 40px;
    }

    .right-header .create-icon,
    .right-header .notification-icon {
        display: none;
    }

    .categories {
        padding: 0 12px;
    }

    main {
        padding: 16px 12px;
    }
}
</style>
</head>

<body>

    <!-- Top navigation -->
    <header class="header">

        <div class="left-header">
            <div class="menu">☰</div>

            <a href="/" style="text-decoration:none;color:inherit;">
                <div class="logo"><span>▶</span> MyTube</div>
            </a>
        </div>

        <form class="search-box" action="/" method="get">
            <input
                type="search"
                name="q"
                placeholder="Search"
                aria-label="Search videos"
            >
            <button type="submit" aria-label="Search">🔍</button>
        </form>

        <div class="right-header">
            <span class="header-icon create-icon" title="Create">＋</span>
            <span class="header-icon notification-icon" title="Notifications">🔔</span>
            <div class="profile">U</div>
        </div>

    </header>

    <!-- Left sidebar -->
    <aside class="sidebar">

        <a href="/" class="active">
            <span class="sidebar-icon">⌂</span> Home
        </a>

        <a href="/shorts/">
            <span class="sidebar-icon">▶</span> Shorts
        </a>

        <a href="/subscriptions/">
            <span class="sidebar-icon">▣</span> Subscriptions
        </a>

        <hr>

        <h4>You &nbsp; ›</h4>

        <a href="/history/">
            <span class="sidebar-icon">◷</span> History
        </a>

        <a href="/playlists/">
            <span class="sidebar-icon">☷</span> Playlists
        </a>

        <a href="/my-videos/">
            <span class="sidebar-icon">▣</span> Your videos
        </a>

        <a href="/watch-later/">
            <span class="sidebar-icon">◴</span> Watch later
        </a>

        <hr>

        <h4 class="extra">Explore</h4>

        <a href="/trending/">
            <span class="sidebar-icon">🔥</span> Trending
        </a>

        <a href="/music/">
            <span class="sidebar-icon">♫</span> Music
        </a>

        <a href="/gaming/">
            <span class="sidebar-icon">🎮</span> Gaming
        </a>

    </aside>

    <!-- Main section -->
    <div class="main">

        <!-- Video category filters -->
        <nav class="categories">
            <button class="active" type="button">All</button>
            <button type="button">Music</button>
            <button type="button">Gaming</button>
            <button type="button">Live</button>
            <button type="button">Programming</button>
            <button type="button">News</button>
            <button type="button">Podcasts</button>
            <button type="button">Recently uploaded</button>
        </nav>

        <!-- Dynamic page content -->
        <main>
            {% block content %}
            {% endblock %}
        </main>

    </div>

</body>
</html>
